# DSH 全局安装片段（可选）

> 用途：如果你想让 SYMBIO 在**任意目录**启动 dsh 都能用（而不是每次先 cd 进 symbio/），
> 就把下面的配置合并进你的 DSH 用户级 `settings.yaml`。
>
> 位置（按 DSH 文档）：用户级配置一般在 `~/.dsh/settings.yaml`（Windows：`C:\Users\<你>\.dsh\settings.yaml`）。
> 若该文件已存在，**只追加 `customSkillDirs` 这一段，不要覆盖整个文件**。
>
> ⚠️ 该字段名来自社区文档，未在 0.2.x 全版本逐一验证。若 DSH 报"未知字段"，
> 改用 INSTALL.md 的「方案 B：直接复制到全局技能目录」，效果相同。

```yaml
# ===== SYMBIO 全局技能目录 =====
# 把路径改成你自己的实际路径（Windows 用正斜杠或双反斜杠）
customSkillDirs:
  - "E:/SYMBIO/.dsh/skills"
```

## 校验方法

改完后在**任意目录**启动：

```bash
dsh
```

然后在会话里输入 `/symbio-`，看是否出现技能名补全（或直接问它"列出你当前可用的 симbio 技能"）。
出现 10 个技能名 = 生效；只有一个都没有 = 字段名不对，改用方案 B。

## 为什么不推荐符号链接

Windows 建目录软链（`mklink /D`）需要管理员权限或开发者模式，跨盘迁移时还容易失效。
复制目录是笨办法，但它 100% 能用——**导入这一步不要为了优雅而增加失败点**。
